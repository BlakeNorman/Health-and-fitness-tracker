<!DOCTYPE html>

<html>

<head>

    <title>Reset Password</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="reset-password-page">

    <div class="page">

        <div class="page-header">

            <h1>Reset Password</h1>

        </div>

        <div class="module create-form-module">

            <form id="resetPasswordForm">

                <div class="form-group">

                    <label for="newPassword">
                        New Password
                    </label>

                    <input id="newPassword" type="password" placeholder="New Password" required>

                </div>

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <input id="confirmPassword" type="password" placeholder="Confirm Password" required>

                </div>

                <div class="form-submit">

                    <button type="submit" class="button-primary">
                        Reset Password
                    </button>

                </div>

                <div id="passwordResetError" class="form-help"></div>

                <div class="form-submit">

                    <button type="button" onclick="window.location.href=`/`">
                        Return to Login Page
                    </button>

                </div>

            </form>

        </div>

    </div>

    <script>

        document.getElementById("resetPasswordForm").onsubmit = async function (e) {

            e.preventDefault();

            const newPassword = document.getElementById("newPassword").value;

            const confirmPassword = document.getElementById("confirmPassword").value;

            if (newPassword !== confirmPassword) {
                alert("Passwords do not match");
                return;
            }

            const token = window.location.pathname.split("/").pop();

            const errorElement = document.getElementById("passwordResetError");

            errorElement.textContent = "";

            const response = await fetch(`/user/reset-password/${token}`, {

                method: "POST",

                headers: { "Content-Type": "application/json" },

                body: JSON.stringify({ password: newPassword })

            });

            if (response.ok) {

                alert("Password reset");

                window.location.href = "/";

            } else {

                const error = await response.json();

                errorElement.textContent = error.detail || "Password reset failed";

            }

        };

    </script>

</body>

</html>
