<!DOCTYPE html>

<html>

<head>

    <title>Request Password Reset</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="request-password-reset-page">

    <div class="page">

        <div class="page-header">

            <h1>Request Password Reset</h1>

        </div>

        <form>

            <div id="requestPasswordResetForm" class="module create-form-module">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input id="email" type="email" placeholder="Email">

                </div>


                <div class="form-submit">

                    <button type="button" class="button-primary" onclick="requestPasswordReset()">
                        Send Link
                    </button>

                </div>

                <div class="form-submit">

                    <button type="button" onclick="window.location.href=`/`">
                        Return to Login Page
                    </button>

                </div>

            </div>

        </form>

    </div>

    <script>

        async function requestPasswordReset() {

            const email = document.getElementById("email").value;

            const resetPasswordRequestMessage = document.getElementById("resetPasswordRequestMessage");

            const response = await fetch("/user/forgot-password", {

                method: "POST",

                headers: { "Content-Type": "application/json" },

                body: JSON.stringify({ email: email })

            });

            const data = await response.json();

            alert(data.message);

        }

    </script>

</body>

</html>
