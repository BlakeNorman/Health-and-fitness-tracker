<!DOCTYPE html>
<html>

<head>

    <title>Daily Activities</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="daily-log-page">

    <div class="page">

        <div class="page-header">

            <h1 id="dateTitle"></h1>

            <button type="button" class="logout-button" onclick="logout()">
                Log Out
            </button>

            <button type="button" class="account-button" onclick="account()">
                Account
            </button>

            <div class="date-controls">

                <div class="date-row">

                    <label for="datePicker">
                        Change Date:
                    </label>

                    <input type="date" id="datePicker">

                    <button type="Button" onclick="viewCalendarYear()">
                        View Calendar Year
                    </button>

                    <button type="button" onclick="dataVisualizations()">
                        View Graphs
                    </button>

                </div>

            </div>

            <div class="create-buttons">

                <button type="Button" onclick="createHealthLog()">
                    Create Health Log
                </button>

                <button type="Button" onclick="createActivity()">
                    Create Activity
                </button>

            </div>

        </div>

        <div class="log-grid">

            <section>

                <h2>Health Log</h2>

                <div class="module" id="health"></div>

            </section>

            <section>

                <h2>Activity Log</h2>

                <div class="module" id="activities"></div>

            </section>

        </div>

    </div>


    <script>

        const date = window.location.pathname.split("/").pop();

        document.getElementById("dateTitle").textContent =
            `Daily Log For ${date}`;

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "/";
        }

        function account() {
            window.location.href = "/account";
        }

        const datePicker = document.getElementById("datePicker");

        datePicker.value = date;

        datePicker.onchange = function () {
            window.location.href = `/calendar/${this.value}`;
        };

        function viewCalendarYear() {
            window.location.href = `/calendar`
        }

        function dataVisualizations() {
            window.location.href = `/data-visualizations`
        }

        function createActivity() {
            window.location.href = `/create-activity/${date}`;
        }

        function createHealthLog() {
            window.location.href = `/create-health-log/${date}`;
        }

        function authHeaders() {
            const token = localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/";
                return {};
            }

            return {
                "Authorization": `Bearer ${token}`
            };
        }

        async function loadActivities() {

            const response = await fetch(`/activity/date/${date}`, {
                headers: authHeaders()
            });

            const list = document.getElementById("activities");

            list.innerHTML = "";

            if (!response.ok) {
                list.innerHTML = `<p>Could not load activities.</p>`;
                return;
            }

            const activities = await response.json();

            if (activities.length === 0) {
                list.innerHTML = `<p>No activities logged on this day.</p>`;
                return;
            }

            for (const activity of activities) {

                let details = "";

                if (activity.category === "Running") {
                    const response = await fetch(`/running/${activity.id}`, {
                        headers: authHeaders()
                    });

                    const run = await response.json();

                    details = `
                    <p><strong>Distance:</strong> ${run.distance} miles</p>
                    <p><strong>Pace:</strong> ${formatTime(run.pace)} / mile</p>
                `;

                }

                else if (activity.category === "Walking") {
                    const response = await fetch(`/walking/${activity.id}`, {
                        headers: authHeaders()
                    });

                    const walk = await response.json();

                    details = `
                    <p><strong>Distance:</strong> ${walk.distance} miles</p>
                    <p><strong>Pace:</strong> ${formatTime(walk.pace)} / mile</p>
                `;

                }

                else if (activity.category === "Cycling") {
                    const response = await fetch(`/cycling/${activity.id}`, {
                        headers: authHeaders()
                    });

                    const cycle = await response.json();

                    details = `
                    <p><strong>Distance:</strong> ${cycle.distance} miles</p>
                    <p><strong>Pace:</strong> ${formatTime(cycle.pace)} / mile</p>
                `;

                }

                else if (activity.category === "Weightlifting") {
                    const response = await fetch(`/weightlifting/${activity.id}`, {
                        headers: authHeaders()
                    });

                    const session = await response.json();

                    details = `
                    <h4>Exercises</h4>
                    <ul>
                        ${session.exercises.map(exercise => `
                            <li>
                                ${exercise.exercise}
                                -
                                ${exercise.weight} lbs
                                x ${exercise.reps} reps
                                x ${exercise.sets} sets
                            </li>
                        `).join("")}
                    </ul>
                `;
                }

                function formatTime(totalSeconds) {
                    const hours = Math.floor(totalSeconds / 3600);
                    const minutes = Math.floor((totalSeconds % 3600) / 60)
                    const seconds = Math.floor(totalSeconds % 60)

                    return `${hours}:${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
                }

                const card = document.createElement("div");

                card.innerHTML = `
                <h3>${activity.category}</h3>

                <p>
                    <strong>Description:</strong> 
                    ${activity.description}
                </p>

                <p>
                    <strong>Duration:</strong> 
                    ${formatTime(activity.duration)}
                </p>

                ${details}

                <button class="button-primary" onclick="editActivity(${activity.id}, '${activity.category}')">
                    Edit
                </button>

                <button class="button-danger" onclick="deleteActivity(${activity.id})">
                    Delete
                </button>
            `;

                list.appendChild(card);
            }
        }

        function calculateSleepLength(bedtime, wakeTime) {
            if (!bedtime || !wakeTime) {
                return null;
            }

            const [bedtimeHour, bedtimeMinute] = bedtime.split(":").map(Number);
            const [wakeHour, wakeMinute] = wakeTime.split(":").map(Number);

            let bedtimeMinutes = bedtimeHour * 60 + bedtimeMinute;
            let wakeMinutes = wakeHour * 60 + wakeMinute;

            if (wakeMinutes <= bedtimeMinutes) {
                wakeMinutes += 24 * 60;
            }

            const duration = wakeMinutes - bedtimeMinutes;

            const hours = Math.floor(duration / 60);
            const minutes = duration % 60;

            return `${hours} hr ${minutes} min`;
        }

        function formatTime(timeString) {
            if (!timeString) {
                return "No data entered";
            }

            const [hour, minute] = timeString.split(":").map(Number);

            const period = hour >= 12 ? "PM" : "AM";
            const hour12 = hour % 12 || 12;

            return `${hour12}:${String(minute).padStart(2, "0")} ${period}`;
        }

        async function loadHealth() {

            const response = await fetch(`/health/date/${date}`, {
                headers: authHeaders()
            });

            const container = document.getElementById("health");

            container.innerHTML = "";

            if (!response.ok) {
                container.innerHTML = `<p>No health information logged on this day.</p>`;
                return;
            }

            const health = await response.json();

            const sleepLength = calculateSleepLength(health.bedtime, health.wake_time);

            const card = document.createElement("div");

            card.innerHTML = `

            <p>
                <strong>Notes:</strong> 
                ${health.notes?.trim() || "No notes"}
            </p>

            <p>
                <strong>Calories Consumed:</strong>
                ${health.calories ?? "No data entered"}
            </p>

            <p>
                <strong>Macros</strong>
                <br>
                Fats (g): ${health.fats ?? "No data entered"}
                <br>
                Carbs (g): ${health.carbs ?? "No data entered"}
                <br>
                Protein (g): ${health.protein ?? "No data entered"}
            </p>   
                
            <h4>Foods Eaten</h4>
            
            ${health.foods?.length > 0 ? `
                <ul>
                    ${health.foods.map(food => `
                        <li>
                            <strong>${food.food}</strong>
                            ${health.nutrition_calculation === "food_based" ? `
                            <ul>
                                <li>Calories: ${food.calories ?? "No data entered"}</li>
                                <li>Fats (g): ${food.fats ?? "No data entered"}</li>
                                <li>Carbs (g): ${food.carbs ?? "No data entered"}</li>
                                <li>Protein (g): ${food.protein ?? "No data entered"}</li>
                            </ul>
                            ` : ""}
                        </li>
                    `).join("")}
                </ul>
                `
                    : `<p>No foods entered</p>`
                }

            <p>
                <strong>Water (fl oz):</strong>
                ${health.water ?? "No data entered"} 
            </p>

            <p>
                <strong>Body Weight (lbs):</strong>
                ${health.weight ?? "No data entered"}
            </p>

            <p>
                <strong>Sleep Information</strong>
                <br>
                Bedtime: ${formatTime(health.bedtime)}
                <br>
                Wake Time: ${formatTime(health.wake_time)}
                <br>
                Amount of Sleep: ${sleepLength ?? "Missing bedtime and/or wake time data"}
            </p>


            <button class="button-primary" onclick="editHealthLog(${health.id})">
                Edit
            </button>

            <button class="button-danger" onclick="deleteHealthLog(${health.id})">
                Delete
            </button>
        `;

            container.appendChild(card);

        }

        loadHealth();

        async function deleteActivity(id) {

            const confirmed = confirm("Delete this activity?");

            if (!confirmed) {
                return;
            }

            const response = await fetch(`/activity/${id}`, {

                method: "DELETE",

                headers: authHeaders()

            });

            if (response.ok) {
                loadActivities();
            } else {
                const error = await response.json();
                alert(error.detail || "Could not delete activity");
            }

        }

        async function deleteHealthLog(id) {

            const confirmed = confirm("Delete this health log?");

            if (!confirmed) {
                return;
            }

            const response = await fetch(`/health/${id}`, {

                method: "DELETE",

                headers: authHeaders()

            });


            if (response.ok) {
                loadHealth();
            }
            else {
                const error = await response.json();
                alert(error.detail || "Could not delete health log");
            }

        }

        function editActivity(id, category) {

            window.location.href =
                `/edit-activity/${category.toLowerCase()}/${id}`;

        }

        function editHealthLog(id) {

            window.location.href =
                `/edit-health-log/${id}`;

        }

        loadActivities();

    </script>

</body>

</html>
