<!DOCTYPE html>
<html>

<head>

    <title>Edit Health Log</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="modify-page">

    <div class="page">

        <div class="page-header">

            <h1 id="modifyHealthLogTitle"></h1>

            <button type="button" class="logout-button" onclick="logout()">
                Log Out
            </button>

            <button type="button" class="account-button" onclick="account()">
                Account
            </button>

            <div class="date-controls">

                <div class="date-row">

                    <button type="Button" onclick="viewCalendarYear()">
                        View Calendar Year
                    </button>

                    <button type="Button" onclick="returnToLogPage()">
                        Return To Daily Log
                    </button>

                </div>

            </div>

        </div>

        <form id="healthEntryForm">

            <div class="module create-form-module">

                <div class="form-group">

                    <label for="notes">
                        Notes
                    </label>

                    <textarea id="notes" placeholder="Notes"></textarea>

                </div>

                <div class="form-group">

                    <label for="nutritionCalculation">
                        Nutrition
                    </label>

                    <select id="nutritionCalculation">

                        <option value="manual">
                            Manually Enter Calorie/Macro Totals
                        </option>

                        <option value="food_based">
                            Calculate Calorie/Macro Totals from Foods
                        </option>

                    </select>

                </div>

                <div id="manualNutrition">

                    <div class="form-group">

                        <label for="calories">
                            Calories Consumed
                        </label>

                        <input id="calories" type="number" min="0" placeholder="Calories Consumed">

                    </div>

                    <div class="form-group">

                        <label>
                            Macros
                        </label>

                        <div class="macro-inputs">

                            <div class="macro-row">

                                <label for="fats">
                                    Fats:
                                </label>

                                <input id="fats" type="number" step="0.5" min="0" placeholder="Fats (g)">

                            </div>

                            <div class="macro-row">

                                <label for="carbs">
                                    Carbs:
                                </label>

                                <input id="carbs" type="number" step="0.5" min="0" placeholder="Carbs (g)">

                            </div>

                            <div class="macro-row">

                                <label for="protein">
                                    Protein:
                                </label>

                                <input id="protein" type="number" step="0.5" min="0" placeholder="Protein (g)">

                            </div>

                        </div>

                    </div>

                </div>

                <div class="form-section">

                    <div class="food-section">

                        <h3>Foods Eaten</h3>

                        <div id="foodList"></div>

                        <button type="button" class="button-primary" onclick="addFood()">
                            Add Food
                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label for="water">
                        Water (fl oz)
                    </label>

                    <input id="water" type="number" step="1" min="0" placeholder="Water (fl oz)">

                </div>

                <div class="form-group">

                    <label for="weight">
                        Body Weight (lbs)
                    </label>

                    <input id="weight" type="number" step="0.1" min="0" placeholder="Body Weight (lbs)">

                </div>

                <div class="form-section">

                    <h3>Sleep Information</h3>

                    <div class="sleep-inputs">

                        <div class="sleep-row">

                            <label for="bedtimeHour">
                                Bedtime:
                            </label>

                            <input id="bedtimeHour" type="number" min="1" max="12" placeholder="HH">

                            <span>:</span>

                            <input id="bedtimeMinute" type="number" min="0" max="59" placeholder="MM">

                            <select id="bedtimePeriod">
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>

                        </div>

                        <div class="sleep-row">

                            <label for="wakeHour">
                                Wake Time:
                            </label>

                            <input id="wakeHour" type="number" min="1" max="12" placeholder="HH">

                            <span>:</span>

                            <input id="wakeMinute" type="number" min="0" max="59" placeholder="MM">

                            <select id="wakePeriod">
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>

                        </div>

                    </div>

                </div>

            </div>

            <div class="form-submit">

                <button type="submit">
                    Save Changes
                </button>

            </div>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

    <script>

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "/";
        }

        function account() {
            window.location.href = "/account";
        }

        function authHeaders() {
            const token = localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/";
                return {};
            }

            return {
                "Authorization": `Bearer ${token}`
            };
        }

        const id = window.location.pathname.split("/").pop();

        const nutritionCalculation = document.getElementById("nutritionCalculation");

        function updateNutritionCalculation() {

            const mode = nutritionCalculation.value;

            const manualNutrition = document.getElementById("manualNutrition");

            const foodNutritionSections = document.querySelectorAll(".food-nutrition");

            const foodNutritionInputs = document.querySelectorAll(
                ".foodCalories, .foodFats, .foodCarbs, .foodProtein"
            );

            if (mode === "manual") {

                manualNutrition.hidden = false;

                foodNutritionSections.forEach(section => {
                    section.hidden = true;
                });

                foodNutritionInputs.forEach(input => {
                    input.disabled = true;
                });

            } else {

                manualNutrition.hidden = true;

                foodNutritionSections.forEach(section => {
                    section.hidden = false;
                });

                foodNutritionInputs.forEach(input => {
                    input.disabled = false;
                });

            }

        }

        nutritionCalculation.addEventListener("change", updateNutritionCalculation);

        let health_log;

        async function loadHealthLog() {

            const healthResponse = await fetch(`/health/${id}`, {
                headers: authHeaders()
            });

            if (healthResponse.status === 401) {
                localStorage.removeItem("access_token");
                window.location.href = "/";
                return;
            }

            if (!healthResponse.ok) {
                const error = await healthResponse.json();
                alert(error.detail || "Could not load health log");
                return;
            }

            health_log = await healthResponse.json();

            document.getElementById("modifyHealthLogTitle").textContent =
                `Edit Health Log For ${health_log.log_date}`;

            document.getElementById("notes").value = health_log.notes || "";

            document.getElementById("nutritionCalculation").value =
                health_log.nutrition_calculation || "manual";

            document.getElementById("calories").value = health_log.calories ?? "";

            document.getElementById("fats").value = health_log.fats ?? "";

            document.getElementById("carbs").value = health_log.carbs ?? "";

            document.getElementById("protein").value = health_log.protein ?? "";

            document.getElementById("water").value = health_log.water ?? "";

            document.getElementById("weight").value = health_log.weight ?? "";

            setTimeFields(
                health_log.bedtime,
                "bedtimeHour",
                "bedtimeMinute",
                "bedtimePeriod"
            );

            setTimeFields(
                health_log.wake_time,
                "wakeHour",
                "wakeMinute",
                "wakePeriod"
            );

            document.getElementById("foodList").innerHTML = "";

            health_log.foods.forEach(food => {
                addFood(
                    food.food,
                    food.calories,
                    food.fats,
                    food.carbs,
                    food.protein
                );

            });

            updateNutritionCalculation();

        }

        function viewCalendarYear() {
            window.location.href = `/calendar`
        }

        function returnToLogPage() {
            window.location.href = `/calendar/${health_log.log_date}`
        }

        function addFood(
            name = "",
            calories = null,
            fats = null,
            carbs = null,
            protein = null
        ) {

            const container = document.getElementById("foodList");

            const div = document.createElement("div");

            div.className = "food";

            div.innerHTML = `
            <div class="dragHandle">⠿</div>

            <div class="food-inputs">

                <input class="foodName" 
                        placeholder="Food" 
                        value="${name}">

                <div class="food-nutrition">

                    <input class="foodCalories" type="number" min="0" step="1" placeholder="Calories" value="${calories ?? ""}">

                    <input class="foodFats" type="number" min="0" step="0.1" placeholder="Fats" value="${fats ?? ""}">

                    <input class="foodCarbs" type="number" min="0" step="0.1" placeholder="Carbs" value="${carbs ?? ""}">

                    <input class="foodProtein" type="number" min="0" step="0.1" placeholder="Protein" value="${protein ?? ""}">

                </div>
                
            </div>

            <button type="button" class="button-danger"
                    onclick="this.parentElement.remove()">
                Remove
            </button>
        `;

            container.appendChild(div)

            updateNutritionCalculation();

        }

        new Sortable(document.getElementById("foodList"), {
            animation: 150,
            handle: ".dragHandle"
        });

        function to24Hour(hour, period) {
            if (period === "AM") {
                return hour === 12 ? 0 : hour;
            } else {
                return hour === 12 ? 12 : hour + 12;
            }
        }

        function setTimeFields(timeString, hourId, minuteId, periodId) {
            if (!timeString) {
                document.getElementById(hourId).value = "";
                document.getElementById(minuteId).value = "";
                return;
            }

            const [hour24, minute] = timeString.split(":").map(Number);

            let hour12;
            let period;

            if (hour24 === 0) {
                hour12 = 12;
                period = "AM";
            } else if (hour24 < 12) {
                hour12 = hour24;
                period = "AM";
            } else if (hour24 === 12) {
                hour12 = 12;
                period = "PM";
            } else {
                hour12 = hour24 - 12;
                period = "PM";
            }

            document.getElementById(hourId).value = hour12;
            document.getElementById(minuteId).value = String(minute).padStart(2, "0");
            document.getElementById(periodId).value = period;

        }

        function numberOrNull(id) {
            const value = document.getElementById(id).value;
            return value === "" ? null : Number(value);
        }

        function numberFromElement(element) {
            const value = element.value;
            return value === "" ? null : Number(value);
        }

        document.getElementById("healthEntryForm").onsubmit = async function (e) {

            e.preventDefault();

            const notes = document.getElementById("notes").value;

            const calories = numberOrNull("calories");

            const fats = numberOrNull("fats");

            const carbs = numberOrNull("carbs");

            const protein = numberOrNull("protein");

            const water = numberOrNull("water");

            const weight = numberOrNull("weight");

            const bedtimeHourField = document.getElementById("bedtimeHour").value;
            const bedtimeMinuteField = document.getElementById("bedtimeMinute").value;
            const bedtimePeriod = document.getElementById("bedtimePeriod").value;

            const wakeHourField = document.getElementById("wakeHour").value;
            const wakeMinuteField = document.getElementById("wakeMinute").value;
            const wakePeriod = document.getElementById("wakePeriod").value;

            let bedtime = null;
            let wakeTime = null;

            const bedtimeEntered =
                bedtimeHourField !== "" || bedtimeMinuteField !== "";

            const wakeTimeEntered =
                wakeHourField !== "" || wakeMinuteField !== "";

            if (bedtimeEntered) {
                if (bedtimeHourField === "" || bedtimeMinuteField === "") {
                    alert("Please enter both the bedtime hour and minute.");
                    return;
                }

                const bedtimeHour = Number(bedtimeHourField);
                const bedtimeMinute = Number(bedtimeMinuteField);

                const bedtime24 = to24Hour(bedtimeHour, bedtimePeriod);

                bedtime =
                    `${String(bedtime24).padStart(2, "0")}:${String(bedtimeMinute).padStart(2, "0")}`;
            }

            if (wakeTimeEntered) {
                if (wakeHourField === "" || wakeMinuteField === "") {
                    alert("Please enter both the wake time hour and minute.");
                    return;
                }

                const wakeHour = Number(wakeHourField);
                const wakeMinute = Number(wakeMinuteField);

                const wake24 = to24Hour(wakeHour, wakePeriod);

                wakeTime =
                    `${String(wake24).padStart(2, "0")}:${String(wakeMinute).padStart(2, "0")}`;
            }

            const foods = [];

            document.querySelectorAll(".food").forEach(div => {

                const food = div.querySelector(".foodName").value.trim();

                if (food !== "") {
                    foods.push({
                        food: food,
                        calories: numberFromElement(div.querySelector(".foodCalories")),
                        fats: numberFromElement(div.querySelector(".foodFats")),
                        carbs: numberFromElement(div.querySelector(".foodCarbs")),
                        protein: numberFromElement(div.querySelector(".foodProtein")),
                    });
                }

            });

            const body = {
                notes: notes,
                nutrition_calculation: nutritionCalculation.value,
                water: water,
                weight: weight,
                bedtime: bedtime,
                wake_time: wakeTime,
                foods: foods
            };

            if (nutritionCalculation.value === "manual") {
                body.calories = calories;
                body.fats = fats;
                body.carbs = carbs;
                body.protein = protein;
            }

            const response = await fetch(`/health/${id}`, {

                method: "PATCH",

                headers: {
                    "Content-Type": "application/json",
                    ...authHeaders()
                },

                body: JSON.stringify(body)

            });

            if (response.ok) {

                const updatedHealth = await response.json();

                console.log("Updated health:", updatedHealth);

                window.location.href = `/calendar/${updatedHealth.log_date}`;

            } else {

                const error = await response.json();

                alert(error.detail || "Could not modify health log");

            }

        };

        loadHealthLog();

    </script>

</body>

</html>
