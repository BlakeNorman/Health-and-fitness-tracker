<!DOCTYPE html>
<html>

<head>

    <title>Create Health Log</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="create-page">

    <div class="page">

        <div class="page-header">

            <h1 id="createHealthLogTitle"></h1>

            <button type="button" class="logout-button" onclick="logout()">
                Log Out
            </button>

            <button type="button" class="account-button" onclick="account()">
                Account
            </button>

            <div class="date-controls">

                <div class="date-row">

                    <label for="datePicker">
                        Change Date:
                    </label>

                    <input type="date" id="datePicker" required>

                    <button type="Button" onclick="viewCalendarYear()">
                        View Calendar Year
                    </button>

                    <button type="Button" onclick="returnToLogPage()">
                        Return To Daily Log
                    </button>

                </div>

            </div>

        </div>

        <form id="healthEntryForm">

            <div class="module create-form-module">

                <div class="form-group">

                    <label for="notes">
                        Notes
                    </label>

                    <textarea id="notes" placeholder="Notes"></textarea>

                </div>

                <div class="form-group">

                    <label for="nutritionCalculation">
                        Nutrition
                    </label>

                    <select id="nutritionCalculation">
                        <option value="manual">Manually Enter Calorie/Macro Totals</option>
                        <option value="food_based">Calculate Calorie/Macro Totals From Foods</option>
                    </select>

                </div>

                <div id="manualNutrition">

                    <div class="form-group">

                        <label for="calories">
                            Calories Consumed
                        </label>

                        <input id="calories" class="calories-input" type="number" min="0"
                            placeholder="Calories Consumed">

                    </div>

                    <div class="form-group">

                        <label>
                            Macros
                        </label>

                        <div class="macro-inputs">

                            <div class="macro-row">

                                <label for="fats">
                                    Fats:
                                </label>

                                <input id="fats" type="number" step="0.5" min="0" placeholder="Fats (g)">

                            </div>

                            <div class="macro-row">

                                <label for="carbs">
                                    Carbs:
                                </label>

                                <input id="carbs" type="number" step="0.5" min="0" placeholder="Carbs (g)">

                            </div>

                            <div class="macro-row">

                                <label for="protein">
                                    Protein:
                                </label>

                                <input id="protein" type="number" step="0.5" min="0" placeholder="Protein (g)">

                            </div>

                        </div>

                    </div>

                </div>

                <div class="form-section">

                    <div class="food-section">

                        <h3>Foods Eaten</h3>

                        <div id="foodList"></div>

                        <button type="button" class="button-primary" onclick="addFood()">
                            Add Food
                        </button>

                    </div>

                </div>

                <div class="form-group">

                    <label for="water">
                        Water (fl oz)
                    </label>

                    <input id="water" type="number" step="1" min="0" placeholder="Water (fl oz)">

                </div>

                <div class="form-group">

                    <label for="weight">
                        Body Weight (lbs)
                    </label>

                    <input id="weight" type="number" step="0.1" min="0" placeholder="Body Weight (lbs)">

                </div>

                <div class="form-section">

                    <h3>Sleep Information</h3>

                    <div class="sleep-inputs">

                        <div class="sleep-row">

                            <label for="bedtimeHour">
                                Bedtime:
                            </label>

                            <input id="bedtimeHour" type="number" min="1" max="12" placeholder="HH">

                            <span>:</span>

                            <input id="bedtimeMinute" type="number" min="0" max="59" placeholder="MM">

                            <select id="bedtimePeriod">
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>

                        </div>

                        <div class="sleep-row">

                            <label for="wakeHour">
                                Wake Time:
                            </label>

                            <input id="wakeHour" type="number" min="1" max="12" placeholder="HH">
                            <span>:</span>
                            <input id="wakeMinute" type="number" min="0" max="59" placeholder="MM">

                            <select id="wakePeriod">
                                <option value="AM">AM</option>
                                <option value="PM">PM</option>
                            </select>

                        </div>

                    </div>

                </div>

            </div>

            <div class="form-submit">

                <button type="submit">
                    Create Health Log
                </button>

            </div>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

    <script>

        const token = localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "/";
        }

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "/";
        }

        function account() {
            window.location.href = "/account";
        }

        function authHeaders() {
            const token = localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/";
                return {};
            }

            return {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            };
        }

        const log_date = window.location.pathname.split("/").pop();

        const datePicker = document.getElementById("datePicker");

        datePicker.value = log_date;

        document.getElementById("createHealthLogTitle").textContent =
            `Create Health Log For ${log_date}`;

        datePicker.onchange = function () {
            window.location.href = `/create-health-log/${this.value}`;
        };

        function viewCalendarYear() {
            window.location.href = `/calendar`
        }

        function returnToLogPage() {
            window.location.href = `/calendar/${log_date}`
        }

        function addFood() {

            const container = document.getElementById("foodList");

            const div = document.createElement("div");

            div.className = "food";

            div.innerHTML = `
            <div class="dragHandle">⠿</div>

            <div class="food-inputs">

                <input class="foodName" placeholder="Food">

                <div class="food-nutrition">

                    <input class="foodCalories" type="number" min="0" step="1" placeholder="Calories">

                    <input class="foodFats" type="number" min="0" step="0.1" placeholder="Fats (g)">

                    <input class="foodCarbs" type="number" min="0" step="0.1" placeholder="Carbs (g)">

                    <input class="foodProtein" type="number" min="0" step="0.1" placeholder="Protein (g)">

                </div>

            </div>

            <button type="button" class="button-danger"
                    onclick="this.parentElement.remove()">
                Remove
            </button>
        `;

            container.appendChild(div);

            updateNutritionCalculation();

        }

        const nutritionCalculation =
            document.getElementById("nutritionCalculation");


        function updateNutritionCalculation() {

            const mode = nutritionCalculation.value;

            const manualNutrition =
                document.getElementById("manualNutrition");

            const foodNutritionInputs =
                document.querySelectorAll(
                    ".foodCalories, .foodFats, .foodCarbs, .foodProtein"
                );

            const foodNutritionSections =
                document.querySelectorAll(".food-nutrition");


            if (mode === "manual") {

                manualNutrition.hidden = false;

                foodNutritionSections.forEach(section => {
                    section.hidden = true;
                });

                foodNutritionInputs.forEach(input => {
                    input.disabled = true;
                });

            } else {

                manualNutrition.hidden = true;

                foodNutritionSections.forEach(section => {
                    section.hidden = false;
                });

                foodNutritionInputs.forEach(input => {
                    input.disabled = false;
                });

            }

        }


        nutritionCalculation.addEventListener(
            "change",
            updateNutritionCalculation
        );


        addFood();

        updateNutritionCalculation();

        new Sortable(document.getElementById("foodList"), {
            animation: 150,
            handle: ".dragHandle"
        });

        function to24Hour(hour, period) {
            if (period === "AM") {
                return hour === 12 ? 0 : hour;
            } else {
                return hour === 12 ? 12 : hour + 12;
            }
        }

        function numberOrNull(value) { return value === "" ? null : Number(value); }

        document.getElementById("healthEntryForm").onsubmit = async function (e) {

            e.preventDefault();

            const notes = document.getElementById("notes").value;

            const nutritionCalculation = document.getElementById("nutritionCalculation").value;

            const calories = numberOrNull(document.getElementById("calories").value);

            const fats = numberOrNull(document.getElementById("fats").value);

            const carbs = numberOrNull(document.getElementById("carbs").value);

            const protein = numberOrNull(document.getElementById("protein").value);

            const water = numberOrNull(document.getElementById("water").value);

            const weight = numberOrNull(document.getElementById("weight").value);

            const bedtimeHourField = document.getElementById("bedtimeHour").value;
            const bedtimeMinuteField = document.getElementById("bedtimeMinute").value;
            const bedtimePeriod = document.getElementById("bedtimePeriod").value;

            const wakeHourField = document.getElementById("wakeHour").value;
            const wakeMinuteField = document.getElementById("wakeMinute").value;
            const wakePeriod = document.getElementById("wakePeriod").value;

            let bedtime = null;
            let wakeTime = null;

            const bedtimeEntered =
                bedtimeHourField !== "" || bedtimeMinuteField !== "";

            const wakeTimeEntered =
                wakeHourField !== "" || wakeMinuteField !== "";

            if (bedtimeEntered) {
                if (bedtimeHourField === "" || bedtimeMinuteField === "") {
                    alert("Please enter both the bedtime hour and minute.");
                    return;
                }

                const bedtimeHour = Number(bedtimeHourField);
                const bedtimeMinute = Number(bedtimeMinuteField);

                const bedtime24 = to24Hour(bedtimeHour, bedtimePeriod);

                bedtime =
                    `${String(bedtime24).padStart(2, "0")}:${String(bedtimeMinute).padStart(2, "0")}`;
            }

            if (wakeTimeEntered) {
                if (wakeHourField === "" || wakeMinuteField === "") {
                    alert("Please enter both the wake time hour and minute.");
                    return;
                }

                const wakeHour = Number(wakeHourField);
                const wakeMinute = Number(wakeMinuteField);

                const wake24 = to24Hour(wakeHour, wakePeriod);

                wakeTime =
                    `${String(wake24).padStart(2, "0")}:${String(wakeMinute).padStart(2, "0")}`;
            }

            const foods = [];

            document.querySelectorAll(".food").forEach(div => {

                const food = div.querySelector(".foodName").value.trim();

                if (food !== "") {

                    foods.push({
                        food: food,
                        calories: numberOrNull(div.querySelector(".foodCalories").value),
                        fats: numberOrNull(div.querySelector(".foodFats").value),
                        carbs: numberOrNull(div.querySelector(".foodCarbs").value),
                        protein: numberOrNull(div.querySelector(".foodProtein").value),
                    });

                }

            });

            const response = await fetch(`/health/`, {

                method: "POST",

                headers: authHeaders(),

                body: JSON.stringify({

                    log_date: log_date,
                    notes: notes,

                    nutrition_calculation: nutritionCalculation,

                    calories: calories,
                    fats: fats,
                    carbs: carbs,
                    protein: protein,

                    water: water,
                    weight: weight,
                    bedtime: bedtime,
                    wake_time: wakeTime,

                    foods: foods

                })

            });

            if (response.ok) {
                window.location.href = `/calendar/${log_date}`;
            } else {
                const error = await response.json();
                alert(error.detail || "Could not create health log.");
            }
        }
    </script>

</body>

</html>
