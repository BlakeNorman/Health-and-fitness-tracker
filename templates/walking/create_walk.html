<!DOCTYPE html>
<html>

<head>

    <title>Create Walk</title>

    <link rel="stylesheet" href="/static/style.css">

</head>

<body class="create-page">

    <div class="page">

        <div class="page-header">

            <h1 id="createWalkTitle"></h1>

            <button type="button" class="logout-button" onclick="logout()">
                Log Out
            </button>

            <button type="button" class="account-button" onclick="account()">
                Account
            </button>

            <div class="date-controls">

                <div class="date-row">

                    <label for="datePicker">
                        Change Date:
                    </label>

                    <input type="date" id="datePicker" required>

                    <button type="Button" onclick="viewCalendarYear()">
                        View Calendar Year
                    </button>

                    <button type="Button" onclick="returnToLogPage()">
                        Return To Daily Log
                    </button>

                    <button type="button" onclick="returnToCategorySelection()">
                        Category Selection
                    </button>

                </div>

            </div>

        </div>

        <form id="walkEntryForm">

            <div class="module create-form-module">

                <div class="form-group">

                    <label for="description">
                        Description
                    </label><br>

                    <textarea id="description" placeholder="Description"></textarea>

                </div>

                <div class="form-group">

                    <label>
                        Duration
                    </label>

                    <div class="duration-inputs">

                        <input id="hours" type="number" min="0" placeholder="hrs">

                        <span>:</span>

                        <input id="minutes" type="number" min="0" max="59" placeholder="mins">

                        <span>:</span>

                        <input id="seconds" type="number" min="0" max="59" placeholder="secs">

                    </div>

                </div>

                <div class="form-group">

                    <label for="distance">
                        Distance
                    </label>

                    <input id="distance" type="number" step="0.01" min="0" placeholder="Distance (miles)">

                    <p>
                        Pace will be calculated from duration and distance.
                    </p>

                </div>

            </div>

            <div class="form-submit">

                <button type="submit">
                    Create Walk
                </button>

            </div>

        </form>

    </div>

    <script>

        const token = localStorage.getItem("access_token");

        if (!token) {
            window.location.href = "/";
        }

        function logout() {
            localStorage.removeItem("access_token");
            window.location.href = "/";
        }

        function account() {
            window.location.href = "/account";
        }

        function authHeaders() {
            const token = localStorage.getItem("access_token");

            if (!token) {
                window.location.href = "/";
                return {};
            }

            return {
                "Authorization": `Bearer ${token}`,
                "Content-Type": "application/json"
            };
        }

        const log_date = window.location.pathname.split("/").pop();

        const datePicker = document.getElementById("datePicker");

        datePicker.value = log_date;

        document.getElementById("createWalkTitle").textContent =
            `Create Walk For ${log_date}`;

        datePicker.onchange = function () {
            window.location.href = `/create-activity/walking/${this.value}`;
        };

        function viewCalendarYear() {
            window.location.href = `/calendar`
        }

        function returnToLogPage() {
            window.location.href = `/calendar/${log_date}`
        }

        function returnToCategorySelection() {
            window.location.href = `/create-activity/${log_date}`
        }

        document.getElementById("walkEntryForm").onsubmit = async function (e) {

            e.preventDefault();

            const description = document.getElementById("description").value

            const hours = Number(document.getElementById("hours").value || 0);
            const minutes = Number(document.getElementById("minutes").value || 0);
            const seconds = Number(document.getElementById("seconds").value || 0)

            const duration = hours * 3600 + minutes * 60 + seconds;

            if (duration <= 0) {
                alert("Enter a valid duration");
                return;
            }

            const distance = parseFloat(document.getElementById("distance").value);

            if (!distance || distance <= 0) {
                alert("Enter a valid distance");
                return;
            }

            const pace = Math.round(duration / distance)

            const response = await fetch(`/walking/`, {

                method: "POST",

                headers: authHeaders(),

                body: JSON.stringify({

                    log_date: log_date,
                    description: description,
                    duration: duration,
                    distance: distance,
                    pace: pace

                })
            });

            if (response.ok) {
                window.location.href = `/calendar/${log_date}`;
            } else {
                alert("Could not create activity.");
            }
        }

    </script>

</body>

</html>
